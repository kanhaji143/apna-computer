<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){try{var t=localStorage.getItem('blogTheme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <title>Posts — Blog Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/blog/assets/admin.css">
</head>
<body>

    <main class="main">
        <div class="page-head">
            <div>
                <h1>Posts</h1>
                <p id="counts">Loading…</p>
            </div>
            <span class="sp"></span>
            <a class="btn primary" href="/blog/admin/editor.html"><i class="fas fa-plus"></i> New Post</a>
        </div>

        <div class="toolbar">
            <div class="grow">
                <i class="fas fa-search"></i>
                <input id="q" type="search" placeholder="Search by title, category or tag…" aria-label="Search posts">
            </div>
            <select id="status" aria-label="Filter by status">
                <option value="">All statuses</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
                <option value="scheduled">Scheduled</option>
            </select>
            <select id="cat" aria-label="Filter by category">
                <option value="">All categories</option>
            </select>
            <button class="btn" id="bulkDelete" style="color:var(--red);border-color:#f6d5d5;background:var(--red-light)" disabled>
                <i class="fas fa-trash"></i> Delete selected
            </button>
        </div>

        <div class="card">
            <div class="tbl-wrap">
                <table class="tbl">
                    <thead>
                        <tr>
                            <th style="width:34px"><input type="checkbox" id="selAll" aria-label="Select all"></th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Views</th>
                            <th>Updated</th>
                            <th style="width:190px">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr><td colspan="7" style="text-align:center;color:var(--light);padding:36px">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="/blog/assets/blog.js"></script>
    <script src="/blog/assets/admin.js"></script>
    <script>
    (function () {
        'use strict';
        var B = window.BLOG, A = window.BLOG_ADMIN, esc = B.ui.esc, ui = B.ui;
        var all = [], cats = [];

        function statusPill(p) {
            if (p.status === 'published') {
                /* scheduled but future date shows as scheduled even if status says published */
                if (p.publishedAt && new Date(p.publishedAt).getTime() > Date.now()) return '<span class="pill sched">Scheduled</span>';
                return '<span class="pill pub">Published</span>';
            }
            if (p.status === 'scheduled') return '<span class="pill sched">Scheduled</span>';
            return '<span class="pill draft">Draft</span>';
        }

        function render() {
            var q = (document.getElementById('q').value || '').toLowerCase().trim();
            var st = document.getElementById('status').value;
            var cf = document.getElementById('cat').value;

            var list = all.filter(function (p) {
                var hay = (p.title + ' ' + (p.categoryName || '') + ' ' + (p.slug || '') + ' ' +
                    (p.tagList || []).map(function (t) { return typeof t === 'string' ? t : t.name; }).join(' ')).toLowerCase();
                if (q && hay.indexOf(q) === -1) return false;
                if (st && p.status !== st) return false;
                if (cf && p.categorySlug !== cf) return false;
                return true;
            });

            document.getElementById('counts').textContent =
                all.length + ' total · ' +
                all.filter(function (p) { return p.status === 'published'; }).length + ' published · ' +
                all.filter(function (p) { return p.status !== 'published'; }).length + ' drafts';

            var rows = document.getElementById('rows');
            if (!list.length) {
                rows.innerHTML = '<tr><td colspan="7" style="padding:0">' +
                    A.emptyState('far fa-newspaper', q || st || cf ? 'No posts match your filters' : 'No posts yet',
                        q || st || cf ? 'Try clearing the search or filters.' : 'Click "New Post" to write your first article.') +
                    '</td></tr>';
                updateBulk();
                return;
            }

            rows.innerHTML = list.map(function (p) {
                var thumb = p.featuredImage
                    ? '<img src="' + esc(p.featuredImage) + '" alt="">'
                    : '<i class="far fa-file-lines"></i>';
                return '<tr data-id="' + esc(p.id) + '">' +
                    '<td><input type="checkbox" class="rowSel" value="' + esc(p.id) + '"></td>' +
                    '<td>' +
                        '<div style="display:flex;gap:10px;align-items:center">' +
                            '<span class="thumb-sm">' + thumb + '</span>' +
                            '<div><div class="t-title">' + A.highlight(p.title || 'Untitled', q) + '</div>' +
                            '<div class="t-sub">/' + esc(p.slug || '') + '</div></div>' +
                        '</div>' +
                    '</td>' +
                    '<td>' + (p.categoryName ? '<span class="pill cat">' + esc(p.categoryName) + '</span>' : '<span style="color:var(--light)">—</span>') + '</td>' +
                    '<td>' + statusPill(p) + '</td>' +
                    '<td>' + (p.views || 0).toLocaleString() + '</td>' +
                    '<td style="white-space:nowrap;color:var(--mid);font-size:12.5px">' + ui.fmtDateShort(p.updatedAt || p.createdAt) + '</td>' +
                    '<td>' +
                        '<div class="acts">' +
                            (p.status === 'published' && p.slug
                                ? '<a class="btn sm" href="/blog/read/' + encodeURIComponent(p.slug) + '/" target="_blank" rel="noopener" title="View"><i class="fas fa-eye"></i></a>'
                                : '') +
                            '<a class="btn sm" href="/blog/admin/editor.html?id=' + encodeURIComponent(p.id) + '" title="Edit"><i class="fas fa-pen"></i></a>' +
                            '<button class="btn sm toggle" data-id="' + esc(p.id) + '" title="' + (p.status === 'published' ? 'Unpublish' : 'Publish') + '">' +
                                '<i class="fas ' + (p.status === 'published' ? 'fa-eye-slash' : 'fa-paper-plane') + '"></i></button>' +
                            '<button class="btn sm ghost-danger del" data-id="' + esc(p.id) + '" title="Delete"><i class="fas fa-trash"></i></button>' +
                        '</div>' +
                    '</td>' +
                '</tr>';
            }).join('');

            wireRowActions();
            updateBulk();
        }

        function byId(id) { var f = null; all.forEach(function (p) { if (p.id === id) f = p; }); return f; }

        function wireRowActions() {
            Array.prototype.forEach.call(document.querySelectorAll('.del'), function (b) {
                b.addEventListener('click', function () {
                    var p = byId(b.getAttribute('data-id'));
                    if (!p) return;
                    if (!A.askDelete('Delete "' + (p.title || 'this post') + '" permanently?')) return;
                    b.disabled = true;
                    B.posts.remove(B.coll.posts, p.id).then(function () {
                        all = all.filter(function (x) { return x.id !== p.id; });
                        ui.toast('Post deleted.');
                        render();
                    }).catch(function (e) {
                        ui.toast('Delete failed: ' + e.message, 'error');
                        b.disabled = false;
                    });
                });
            });

            Array.prototype.forEach.call(document.querySelectorAll('.toggle'), function (b) {
                b.addEventListener('click', function () {
                    var p = byId(b.getAttribute('data-id'));
                    if (!p) return;
                    var goingLive = p.status !== 'published';
                    b.disabled = true;
                    var pubDate = goingLive ? (p.publishedAt || new Date().toISOString()) : (p.publishedAt || null);
                    B.posts.set(B.coll.posts, p.id, {
                        status: goingLive ? 'published' : 'draft',
                        publishedAt: pubDate,
                        publishAt: goingLive
                            ? firebase.firestore.Timestamp.fromDate(new Date(pubDate))
                            : null
                    }).then(function () {
                        p.status = goingLive ? 'published' : 'draft';
                        ui.toast(goingLive ? 'Post published.' : 'Post moved to drafts.');
                        render();
                    }).catch(function (e) {
                        ui.toast('Update failed: ' + e.message, 'error');
                        b.disabled = false;
                    });
                });
            });

            Array.prototype.forEach.call(document.querySelectorAll('.rowSel'), function (c) {
                c.addEventListener('change', updateBulk);
            });
        }

        function selected() {
            return Array.prototype.map.call(document.querySelectorAll('.rowSel:checked'), function (c) { return c.value; });
        }

        function updateBulk() {
            var n = selected().length;
            var btn = document.getElementById('bulkDelete');
            btn.disabled = n === 0;
            btn.innerHTML = '<i class="fas fa-trash"></i> Delete selected' + (n ? ' (' + n + ')' : '');
        }

        document.getElementById('selAll').addEventListener('change', function () {
            var on = this.checked;
            Array.prototype.forEach.call(document.querySelectorAll('.rowSel'), function (c) { c.checked = on; });
            updateBulk();
        });

        document.getElementById('bulkDelete').addEventListener('click', function () {
            var ids = selected();
            if (!ids.length) return;
            if (!A.askDelete('Delete ' + ids.length + ' post(s) permanently? This cannot be undone.')) return;
            this.disabled = true;
            Promise.all(ids.map(function (id) { return B.posts.remove(B.coll.posts, id); }))
                .then(function () {
                    all = all.filter(function (p) { return ids.indexOf(p.id) === -1; });
                    ui.toast(ids.length + ' post(s) deleted.');
                    render();
                })
                .catch(function (e) { ui.toast('Bulk delete failed: ' + e.message, 'error'); });
        });

        A.guard('posts', function () {
            Promise.all([
                B.posts.all('updatedAt', 'desc').catch(function () { return []; }),
                B.cats.all('name', 'asc').catch(function () { return []; })
            ]).then(function (r) {
                all = r[0];
                cats = r[1];

                var sel = document.getElementById('cat');
                sel.innerHTML = '<option value="">All categories</option>' +
                    cats.map(function (c) { return '<option value="' + esc(c.slug) + '">' + esc(c.name) + '</option>'; }).join('');

                A.bindToolbar({ searchId: 'q', filterId: 'status', onChange: render });
                document.getElementById('cat').addEventListener('change', render);

                render();
            });
        });
    })();
    </script>
</body>
</html>
