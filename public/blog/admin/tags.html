<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags — Blog Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/blog/assets/admin.css">
</head>
<body>

    <main class="main">
        <div class="page-head">
            <div>
                <h1>Tags</h1>
                <p>Tags improve internal linking and help readers find related posts</p>
            </div>
            <span class="sp"></span>
            <span id="tagCount" style="font-size:13px;color:var(--light)"></span>
        </div>

        <div style="display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start" class="cat-grid">
            <div class="card">
                <h3><i class="fas fa-tag"></i> <span id="formTitle">Add Tag</span></h3>
                <form class="form" id="tagForm">
                    <div>
                        <label for="tName">Name <span class="req">*</span></label>
                        <input id="tName" type="text" placeholder="e.g. formulas" required>
                    </div>
                    <div>
                        <label for="tSlug">Slug</label>
                        <input id="tSlug" type="text" placeholder="formulas">
                    </div>
                    <input type="hidden" id="editId">
                    <div style="display:flex;gap:8px">
                        <button class="btn primary" type="submit" id="saveBtn"><i class="fas fa-floppy-disk"></i> Save</button>
                        <button class="btn" type="button" id="cancelBtn" hidden>Cancel</button>
                    </div>
                </form>
                <p style="font-size:12px;color:var(--light);margin-top:12px;line-height:1.6">
                    Tags you add here appear as suggestions inside the post editor.
                </p>
            </div>

            <div class="card">
                <div class="toolbar" style="margin-bottom:14px">
                    <div class="grow"><i class="fas fa-search"></i><input id="q" type="search" placeholder="Search tags…" aria-label="Search tags"></div>
                </div>
                <div id="tagCloud" style="display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px"></div>
                <div class="tbl-wrap">
                    <table class="tbl">
                        <thead><tr><th>Name</th><th>Slug</th><th>Posts</th><th style="width:150px">Actions</th></tr></thead>
                        <tbody id="rows"><tr><td colspan="4" style="text-align:center;color:var(--light);padding:30px">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="/blog/assets/blog.js"></script>
    <script src="/blog/assets/admin.js"></script>
    <script>
    (function () {
        'use strict';
        var B = window.BLOG, A = window.BLOG_ADMIN, ui = B.ui, esc = ui.esc;
        var tags = [], counts = {};
        var $ = function (id) { return document.getElementById(id); };
        var slugTouched = false;

        $('tName').addEventListener('input', function () { if (!slugTouched && !$('editId').value) $('tSlug').value = B.slugify(this.value); });
        $('tSlug').addEventListener('input', function () { slugTouched = true; });

        function render() {
            var q = ($('q').value || '').toLowerCase().trim();
            var list = tags.filter(function (t) { return !q || (t.name + ' ' + t.slug).toLowerCase().indexOf(q) !== -1; });
            $('tagCount').textContent = tags.length + ' tag' + (tags.length === 1 ? '' : 's');

            /* cloud sized by usage */
            $('tagCloud').innerHTML = tags.slice(0, 30).map(function (t) {
                var n = counts[t.slug] || 0;
                var size = 12 + Math.min(n, 6) * 1.6;
                return '<span class="pill tag" style="font-size:' + size + 'px;padding:6px 12px">#' + esc(t.name) +
                    ' <b style="color:var(--light);margin-left:4px">' + n + '</b></span>';
            }).join('') || '<span style="color:var(--light);font-size:13px">No tags yet.</span>';

            var rows = $('rows');
            if (!list.length) {
                rows.innerHTML = '<tr><td colspan="4" style="padding:0">' +
                    A.emptyState('fas fa-tags', q ? 'No tags match' : 'No tags yet',
                        q ? 'Try a different search.' : 'Add tags to improve internal linking.') + '</td></tr>';
                return;
            }

            rows.innerHTML = list.map(function (t) {
                var n = counts[t.slug] || 0;
                return '<tr>' +
                    '<td><div class="t-title">#' + A.highlight(t.name, q) + '</div></td>' +
                    '<td style="color:var(--mid);font-size:12.5px">/' + esc(t.slug || '') + '</td>' +
                    '<td><span class="pill tag">' + n + ' post' + (n === 1 ? '' : 's') + '</span></td>' +
                    '<td><div class="acts">' +
                        '<a class="btn sm" href="/blog/tag/' + encodeURIComponent(t.slug) + '/" target="_blank" rel="noopener" title="View"><i class="fas fa-eye"></i></a>' +
                        '<button class="btn sm ed" data-id="' + esc(t.id) + '" title="Edit"><i class="fas fa-pen"></i></button>' +
                        '<button class="btn sm ghost-danger del" data-id="' + esc(t.id) + '" title="Delete"><i class="fas fa-trash"></i></button>' +
                    '</div></td>' +
                '</tr>';
            }).join('');

            Array.prototype.forEach.call(document.querySelectorAll('.ed'), function (b) {
                b.addEventListener('click', function () {
                    var t = null; tags.forEach(function (x) { if (x.id === b.getAttribute('data-id')) t = x; });
                    if (!t) return;
                    $('tName').value = t.name; $('tSlug').value = t.slug;
                    $('editId').value = t.id; slugTouched = true;
                    $('formTitle').textContent = 'Edit Tag';
                    $('saveBtn').innerHTML = '<i class="fas fa-floppy-disk"></i> Update';
                    $('cancelBtn').hidden = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            Array.prototype.forEach.call(document.querySelectorAll('.del'), function (b) {
                b.addEventListener('click', function () {
                    var t = null; tags.forEach(function (x) { if (x.id === b.getAttribute('data-id')) t = x; });
                    if (!t) return;
                    if (!A.askDelete('Delete tag "' + t.name + '"?')) return;
                    b.disabled = true;
                    B.tags.remove(B.coll.tags, t.id).then(function () {
                        tags = tags.filter(function (x) { return x.id !== t.id; });
                        ui.toast('Tag deleted.');
                        render();
                    }).catch(function (e) { ui.toast('Delete failed: ' + e.message, 'error'); b.disabled = false; });
                });
            });
        }

        function resetForm() {
            $('tagForm').reset(); $('editId').value = ''; slugTouched = false;
            $('formTitle').textContent = 'Add Tag';
            $('saveBtn').innerHTML = '<i class="fas fa-floppy-disk"></i> Save';
            $('cancelBtn').hidden = true;
        }
        $('cancelBtn').addEventListener('click', resetForm);

        $('tagForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var name = $('tName').value.trim();
            if (!name) { ui.toast('Please enter a tag name.', 'error'); return; }
            var slug = $('tSlug').value.trim() || B.slugify(name);
            var editId = $('editId').value;

            if (tags.some(function (t) { return t.slug === slug && t.id !== editId; })) {
                ui.toast('A tag with this slug already exists.', 'error'); return;
            }

            $('saveBtn').disabled = true;
            var op = editId ? B.tags.set(B.coll.tags, editId, { name: name, slug: slug })
                            : B.tags.add(B.coll.tags, { name: name, slug: slug });

            op.then(function (id) {
                if (editId) { tags.forEach(function (t) { if (t.id === editId) { t.name = name; t.slug = slug; } }); ui.toast('Tag updated.'); }
                else { tags.push({ id: id, name: name, slug: slug }); ui.toast('Tag added.'); }
                resetForm(); render();
            }).catch(function (err) { ui.toast('Save failed: ' + err.message, 'error'); })
              .then(function () { $('saveBtn').disabled = false; });
        });

        A.guard('tags', function () {
            Promise.all([
                B.tags.all('name', 'asc').catch(function () { return []; }),
                B.posts.all('updatedAt', 'desc').catch(function () { return []; })
            ]).then(function (r) {
                tags = r[0];
                r[1].forEach(function (p) {
                    (p.tagList || []).forEach(function (t) {
                        var s = typeof t === 'string' ? B.slugify(t) : t.slug;
                        if (s) counts[s] = (counts[s] || 0) + 1;
                    });
                });
                A.bindToolbar({ searchId: 'q', onChange: render });
                render();
            });
        });
    })();
    </script>
</body>
</html>
