<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Dues · Apna School CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/crm.css?v=11">
</head>
<body data-page="dues">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Previous Dues</h2>
                    <p id="duesCount">Loading...</p>
                </div>
                <span class="badge red" style="font-size:13px;padding:8px 14px">
                    Total Balance: <span id="duesTotal">—</span>
                </span>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3>Previous Sessions Dues</h3>
                </div>
                <div class="table-wrap">
                    <table style="min-width:1100px">
                        <thead>
                            <tr>
                                <th>Adm No</th><th>Student</th><th>Session</th><th>Opening Due</th>
                                <th>Current Yr Due</th><th>Received</th><th>Balance</th>
                                <th>Last Payment</th><th>Remarks</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="duesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<script src="assets/crm.js?v=11"></script>
</body>
</html>
