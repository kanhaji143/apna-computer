<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport · Apna School CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/crm.css?v=11">
</head>
<body data-page="transport">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Transport</h2>
                    <p>Bus routes and transport fees (Transport Route Master)</p>
                </div>
                <button class="btn btn-primary" onclick="CRM.add('transport')">
                    <i class="fas fa-plus"></i> Add Route
                </button>
            </div>

            <div class="card">
                <div class="card-head"><h3>All Routes</h3></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Route Code</th><th>Route Name</th><th>Transport Fee</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="transportBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<script src="assets/crm.js?v=11"></script>
</body>
</html>
