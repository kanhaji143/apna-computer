<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Apna School CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/crm.css?v=11">
</head>
<body data-page="dashboard">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Dashboard</h2>
                    <p id="schoolName">Loading school...</p>
                </div>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                    <span class="badge green" id="sessionBadge">—</span>
                    <button class="btn btn-primary btn-sm" onclick="CRM.whatsappFeeDue()" style="background:#25D366">
                        <i class="fab fa-whatsapp"></i> Fee Due Alert
                    </button>
                </div>
            </div>

            <div class="stats-grid" id="dashStats"></div>

            <div class="card">
                <div class="card-head">
                    <h3>Recent Students</h3>
                    <a href="students.html" class="btn btn-light btn-sm">View All <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Student</th><th>Class</th><th>Status</th></tr></thead>
                        <tbody id="recentStudents"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3>Recent Expenses</h3>
                    <a href="expenses.html" class="btn btn-light btn-sm">View All <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Category</th><th>Date</th><th>Amount</th></tr></thead>
                        <tbody id="recentExpenses"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<script src="assets/crm.js?v=11"></script>
</body>
</html>
