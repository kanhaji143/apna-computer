<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Apna School CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/crm.css?v=11">
</head>
<body data-page="settings">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Settings</h2>
                    <p>School details, WhatsApp alert aur data info</p>
                </div>
                <button class="btn btn-primary" onclick="CRM.saveSchool()"><i class="fas fa-floppy-disk"></i> Save Settings</button>
            </div>

            <div class="card">
                <div class="card-head"><h3><i class="fas fa-school" style="color:var(--primary)"></i> School Details</h3></div>
                <div class="card-body">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
                        <div class="form-group"><label>School Name</label><input class="form-control" id="cfgSchool" placeholder="Lakshya Institute Of Child Education"></div>
                        <div class="form-group"><label>Principal / Owner</label><input class="form-control" id="cfgOwner" placeholder="Krishna Kumar"></div>
                        <div class="form-group"><label>Phone</label><input class="form-control" id="cfgPhone" placeholder="8303324088"></div>
                        <div class="form-group"><label>Academic Session</label><input class="form-control" id="cfgSession" placeholder="2026-27"></div>
                        <div class="form-group" style="grid-column:1/-1"><label>Address</label><input class="form-control" id="cfgAddr" placeholder="Amethi, Uttar Pradesh"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h3><i class="fab fa-whatsapp" style="color:#25D366"></i> WhatsApp Fee Due Alert</h3></div>
                <div class="card-body">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
                        <div class="form-group">
                            <label>WhatsApp Number (country code ke saath)</label>
                            <input class="form-control" id="cfgWa" placeholder="919876543210">
                            <div style="font-size:11.5px;color:var(--muted);margin-top:5px">
                                <i class="fas fa-circle-info"></i> India ke liye <code>91</code> + 10 digit. Jaise <code>919876543210</code>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Due Alert — top kitne students</label>
                            <input type="number" class="form-control" id="cfgDue" placeholder="10">
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="CRM.whatsappFeeDue()" style="background:#25D366;border-color:#25D366">
                        <i class="fab fa-whatsapp"></i> Test — Fee Due Alert Bhejo
                    </button>
                    <button class="btn btn-light" onclick="CRM.copyFeeDue()"><i class="fas fa-copy"></i> List Copy Karo</button>
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h3><i class="fas fa-database" style="color:var(--info)"></i> Data Info</h3></div>
                <div class="card-body" id="syncBox"></div>
            </div>

            <div class="card">
                <div class="card-head"><h3><i class="fas fa-circle-info" style="color:var(--muted)"></i> App Info</h3></div>
                <div class="card-body">
                    <div style="font-size:13.5px;line-height:2">
                        <div><strong>App:</strong> Apna School CRM</div>
                        <div><strong>Version:</strong> 1.0</div>
                        <div><strong>Data Source:</strong> School_ERP_V1.1.3 (Excel) ’ crm-data.json</div>
                        <div><strong>Login:</strong> Demo mode (koi bhi email/password)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/school-fb.js?v=1"></script>
<script src="assets/crm.js?v=12"></script>
</body>
</html>
