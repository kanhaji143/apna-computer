<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent View · Apna School CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/crm.css?v=11">
<style>
  .pv-search { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .pv-search input { flex:1; min-width:220px; padding:10px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px; }
  .pv-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-bottom:14px; }
  .pv-card h3 { font-size:15px; margin-bottom:10px; color:#1e40af; }
  .pv-row { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .pv-row:last-child { border-bottom:0; }
  .pv-row .k { color:#64748b; min-width:140px; font-weight:600; }
  .pv-row .v { color:#0f172a; }
  .pv-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 900px) { .pv-grid { grid-template-columns:1fr; } }
</style>
</head>
<body data-page="parentview">
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div><h2>Parent View</h2><p>Read-only student info for parents (admission no se search)</p></div>
            </div>

            <div class="pv-search">
                <input type="text" id="pvAdm" placeholder="Enter Admission No..." onkeydown="if(event.key==='Enter') PV.load()">
                <button class="btn btn-primary" onclick="PV.load()"><i class="fas fa-search"></i> Search</button>
            </div>

            <div id="pvResult"><p class="small muted">Enter an admission number to search.</p></div>
        </div>
    </div>
</div>
<div id="modalHost"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/school-fb.js?v=1"></script>
<script src="assets/crm.js?v=12"></script>
<script>
(function () {
    'use strict';
    var store = null;
    var db = null;
    var PV = {};

    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function money(n) { return '\u20B9' + Number(n || 0).toLocaleString('en-IN'); }

    PV.load = function () {
        var adm = document.getElementById('pvAdm').value.trim();
        if (!adm) { alert('Enter the admission no'); return; }
        var st = null;
        (store.students || []).forEach(function (s) { if (String(s['Admission No']) === adm) st = s; });
        if (!st) { document.getElementById('pvResult').innerHTML = '<p class="small muted">Student not found: ' + esc(adm) + '</p>'; return; }

        var fee = null;
        (store.feeRegister || []).forEach(function (f) { if (String(f['Admission No']) === adm) fee = f; });
        var admNo = adm;

        // attendance summary from sc_attendance
        db.collection('sc_attendance').where('admissionNo', '==', admNo).get().then(function (snap) {
            var att = { P: 0, A: 0, L: 0, total: 0 };
            snap.forEach(function (d) { var r = d.data(); att.total++; if (r.status === 'P') att.P++; else if (r.status === 'A') att.A++; else if (r.status === 'L') att.L++; });
            // results from sc_results
            return db.collection('sc_results').where('admissionNo', '==', admNo).get().then(function (rsnap) {
                var res = [];
                rsnap.forEach(function (d) { res.push(d.data()); });
                render(st, fee, att, res);
            });
        }).catch(function (e) { console.error(e); render(st, fee, { P:0, A:0, L:0, total:0 }, []); });
    };

    function render(st, fee, att, res) {
        var html = '';
        // student info
        html += '<div class="pv-card"><h3><i class="fas fa-user-graduate"></i> Student Info</h3>';
        html += '<div class="pv-row"><span class="k">Name</span><span class="v">' + esc(st['Student Name']) + '</span></div>';
        html += '<div class="pv-row"><span class="k">Admission No</span><span class="v">' + esc(st['Admission No']) + '</span></div>';
        html += '<div class="pv-row"><span class="k">Father</span><span class="v">' + esc(st['Father Name'] || '—') + '</span></div>';
        html += '<div class="pv-row"><span class="k">Class</span><span class="v">' + esc(st['Class'] || '') + (st['Section'] ? '-' + esc(st['Section']) : '') + '</span></div>';
        html += '<div class="pv-row"><span class="k">Mobile</span><span class="v">' + esc(st['Mobile'] || '—') + '</span></div>';
        html += '<div class="pv-row"><span class="k">Status</span><span class="v">' + esc(st['Status'] || '—') + '</span></div>';
        html += '</div>';

        // fee
        if (fee) {
            html += '<div class="pv-card"><h3><i class="fas fa-indian-rupee-sign"></i> Fee Status</h3>';
            html += '<div class="pv-row"><span class="k">Expected Fee</span><span class="v">' + money(fee['Expected Fee']) + '</span></div>';
            html += '<div class="pv-row"><span class="k">Total Collection</span><span class="v">' + money(fee['Total Collection']) + '</span></div>';
            html += '<div class="pv-row"><span class="k">Outstanding</span><span class="v" style="color:#dc2626;font-weight:700">' + money(fee['Outstanding']) + '</span></div>';
            html += '<div class="pv-row"><span class="k">Fee Status</span><span class="v">' + esc(fee['Fee Status'] || '—') + '</span></div>';
            html += '</div>';
        }

        // attendance
        html += '<div class="pv-card"><h3><i class="fas fa-calendar-check"></i> Attendance</h3>';
        html += '<div class="pv-row"><span class="k">Total Marked</span><span class="v">' + att.total + '</span></div>';
        html += '<div class="pv-row"><span class="k">Present</span><span class="v" style="color:#16a34a">' + att.P + '</span></div>';
        html += '<div class="pv-row"><span class="k">Absent</span><span class="v" style="color:#dc2626">' + att.A + '</span></div>';
        html += '<div class="pv-row"><span class="k">Late</span><span class="v" style="color:#d97706">' + att.L + '</span></div>';
        if (att.total > 0) {
            var pct = Math.round((att.P / att.total) * 100);
            html += '<div class="pv-row"><span class="k">Attendance %</span><span class="v" style="font-weight:700">' + pct + '%</span></div>';
        }
        html += '</div>';

        // results
        if (res.length) {
            html += '<div class="pv-card"><h3><i class="fas fa-file-pen"></i> Results</h3><div class="table-wrap"><table><thead><tr><th>Exam</th><th>Marks</th><th>Max</th><th>%</th><th>Grade</th></tr></thead><tbody>';
            res.forEach(function (r) {
                var pct = r.maxMarks ? Math.round((r.marks / r.maxMarks) * 100) : 0;
                var g = pct >= 90 ? 'A' : pct >= 75 ? 'B' : pct >= 60 ? 'C' : pct >= 40 ? 'D' : 'F';
                html += '<tr><td>' + esc(r.examId) + '</td><td>' + esc(r.marks) + '</td><td>' + esc(r.maxMarks) + '</td><td>' + pct + '%</td><td><b>' + g + '</b></td></tr>';
            });
            html += '</tbody></table></div></div>';
        }

        document.getElementById('pvResult').innerHTML = html;
    }

    window.PV = PV;

    document.addEventListener('DOMContentLoaded', function () {
        if (!window.CRM) return;
        var u = CRM.user();
        if (!u) { location.replace('login.html'); return; }
        var SFB = window.SFB;
        SFB.init();
        var tries = 0;
        var iv = setInterval(function () {
            tries++;
            if (SFB.ready) {
                clearInterval(iv);
                SFB.loadStore().then(function (data) {
                    store = data;
                    store.students = store.students || [];
                    store.feeRegister = store.feeRegister || [];
                    initDb();
                    CRM.renderShell && CRM.renderShell();
                }).catch(function (e) { console.error(e); });
            } else if (tries > 50) { clearInterval(iv); }
        }, 100);
    });

    function initDb() { if (typeof firebase !== 'undefined' && !firebase.apps.length) firebase.initializeApp(SFB.config); db = firebase.firestore(); }
})();
</script>
</body>
</html>
