<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students · Apna School CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/crm.css?v=11">
</head>
<body data-page="students">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Students</h2>
                    <p id="studentsCount">Loading...</p>
                </div>
                <button class="btn btn-primary" onclick="CRM.add('students')">
                    <i class="fas fa-plus"></i> Add Student
                </button>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3>All Students</h3>
                    <input type="text" class="form-control" style="width:240px"
                           placeholder="Search name, adm, father, mother, mobile, aadhaar..."
                           oninput="CRM.globalSearch(this.value)">
                </div>
                <div class="table-wrap">
                    <table id="studentsTable" style="min-width:1850px">
                        <thead>
                            <tr>
                                <th>Adm No</th>
                                <th>Student</th>
                                <th>Father</th>
                                <th>Mother</th>
                                <th>Gender</th>
                                <th>DOB</th>
                                <th>Class</th>
                                <th>Roll</th>
                                <th>Mobile</th>
                                <th>Alt Mobile</th>
                                <th>Aadhaar</th>
                                <th>Pen No</th>
                                <th>Adm Date</th>
                                <th>Adm Type</th>
                                <th>Route</th>
                                <th>Address</th>
                                <th>Status</th>
                                <th>Remarks</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentsBody"></tbody>
                    </table>
                </div>
                <div id="studentsPager"></div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<script src="assets/crm.js?v=11"></script>
</body>
</html>
