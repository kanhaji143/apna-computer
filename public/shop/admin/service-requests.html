<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Requests — Apna Online Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/shop/assets/shop.css">
</head>
<body class="admin-body" data-page="service-requests" data-title="Service Requests">

    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content">

            <div class="page-head">
                <div><h2>Service Requests</h2><p id="info">—</p></div>
                <div class="actions"><button class="btn btn-ghost btn-sm" id="exportBtn"><i class="fas fa-file-csv"></i> Export</button></div>
            </div>

            <div class="filters">
                <input class="grow" id="search" placeholder="🔍 Request ID, naam, mobile ya service...">
                <select id="status">
                    <option value="">All requests</option>
                    <option value="new">New</option>
                    <option value="in_progress">In Progress</option>
                    <option value="pending_documents">Pending Documents</option>
                    <option value="completed">Completed</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Request</th><th>Customer</th><th>Service</th><th>Message</th><th>Status</th><th class="t-right">Actions</th></tr></thead>
                        <tbody id="body"><tr><td colspan="6" class="empty-row">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-backdrop" id="modal">
        <div class="modal">
            <div class="modal-head"><h3>Request Details</h3><button class="x" data-close><i class="fas fa-xmark"></i></button></div>
            <div class="modal-body" id="detail"></div>
            <div class="modal-foot">
                <button class="btn btn-ghost" data-close>Close</button>
                <button class="btn btn-primary" id="saveStatusBtn"><i class="fas fa-check"></i> Update Status</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/shop/assets/shop.js"></script>
    <script>
    (function () {
        'use strict';
        var S = window.SHOP, U = S.ui, rows = [], current = null;

        ['search', 'status'].forEach(function (id) { document.getElementById(id).addEventListener('input', render); });
        document.querySelectorAll('[data-close]').forEach(function (b) {
            b.addEventListener('click', function () { U.closeModal('modal'); });
        });
        document.getElementById('modal').addEventListener('click', function (e) { if (e.target === this) U.closeModal('modal'); });

        S.ready(function () {
            document.getElementById('exportBtn').addEventListener('click', exportCsv);
            document.getElementById('saveStatusBtn').addEventListener('click', saveStatus);
            load();
        });

        function stBadge(s) {
            var map = { new: 'badge blue', in_progress: 'badge amber', pending_documents: 'badge red', completed: 'badge green', rejected: 'badge grey' };
            return '<span class="badge ' + (map[s] || 'badge grey') + '">' + U.esc(String(s || '').replace(/_/g, ' ')) + '</span>';
        }

        function load() {
            S.all(S.coll.requests).then(function (r) {
                rows = r.sort(U.byDateDesc('createdAt'));
                render();
            }).catch(function (e) { console.error(e); U.toast('Could not load data.'); });
        }

        function render() {
            var q = document.getElementById('search').value.trim().toLowerCase();
            var st = document.getElementById('status').value;
            var list = rows.filter(function (r) {
                if (st && r.status !== st) return false;
                if (q && [r.requestId, r.customerName, r.mobile, r.serviceName].join(' ').toLowerCase().indexOf(q) < 0) return false;
                return true;
            });

            var open = rows.filter(function (r) { return r.status === 'new' || r.status === 'in_progress' || r.status === 'pending_documents'; });
            document.getElementById('info').textContent = rows.length + ' requests · ' + open.length + ' open';

            var b = document.getElementById('body');
            b.innerHTML = list.length ? list.map(function (r) {
                return '<tr data-id="' + r.id + '">' +
                    '<td class="t-nowrap"><b style="font-size:11.5px">' + U.esc(r.requestId || '—') + '</b><span class="subtle">' + U.fmtDateTime(r.createdAt) + '</span></td>' +
                    '<td><b>' + U.esc(r.customerName) + '</b><span class="subtle">' + U.esc(r.mobile || '') + '</span></td>' +
                    '<td class="small muted">' + U.esc(r.serviceName) + '</td>' +
                    '<td class="small muted" style="max-width:220px">' + U.esc(r.message || '—') + '</td>' +
                    '<td>' + stBadge(r.status) + '</td>' +
                    '<td class="t-right"><div class="q-actions" style="justify-content:flex-end">' +
                    '<button class="view" title="Details"><i class="fas fa-eye"></i></button>' +
                    '<a class="btn btn-ghost btn-sm btn-icon" title="WhatsApp" target="_blank" rel="noopener" href="' + U.waLink(r.mobile, 'Hello ' + r.customerName + ', aapki request ' + (r.requestId || '') + ' mil gayi hai. — Apna Online Center') + '"><i class="fab fa-whatsapp" style="color:#25D366"></i></a>' +
                    '<button class="del" title="Delete"><i class="fas fa-trash"></i></button></div></td></tr>';
            }).join('') : '<tr><td colspan="6" class="empty-row">No requests found.</td></tr>';

            b.querySelectorAll('tr[data-id]').forEach(function (tr) {
                var rec = rows.filter(function (x) { return x.id === tr.getAttribute('data-id'); })[0];
                tr.querySelector('.view').addEventListener('click', function () { openDetail(rec); });
                tr.querySelector('.del').addEventListener('click', function () {
                    if (!confirm('Delete request?')) return;
                    S.remove(S.coll.requests, rec.id).then(function () { U.toast('Request delete ho gayi.'); load(); });
                });
            });
        }

        function openDetail(r) {
            current = r;
            document.getElementById('detail').innerHTML =
                '<div class="form-grid">' +
                '<div class="field"><label>Request ID</label><input disabled value="' + U.esc(r.requestId) + '"></div>' +
                '<div class="field"><label>Date</label><input disabled value="' + U.fmtDateTime(r.createdAt) + '"></div>' +
                '<div class="field"><label>Customer</label><input disabled value="' + U.esc(r.customerName) + '"></div>' +
                '<div class="field"><label>Mobile</label><input disabled value="' + U.esc(r.mobile) + '"></div>' +
                '<div class="field full"><label>Service</label><input disabled value="' + U.esc(r.serviceName) + '"></div>' +
                '<div class="field full"><label>Message</label><textarea disabled>' + U.esc(r.message || '') + '</textarea></div>' +
                '<div class="field"><label>Status</label><select id="newStatus">' +
                ['new', 'in_progress', 'pending_documents', 'completed', 'rejected'].map(function (s) {
                    return '<option value="' + s + '"' + (r.status === s ? ' selected' : '') + '>' + s.replace(/_/g, ' ') + '</option>';
                }).join('') + '</select></div>' +
                '<div class="field"><label>Admin Notes</label><input id="adminNotes" value="' + U.esc(r.adminNotes || '') + '" placeholder="Internal note"></div>' +
                '</div>';
            U.openModal('modal');
        }

        function saveStatus() {
            if (!current) return;
            var status = document.getElementById('newStatus').value;
            var notes = document.getElementById('adminNotes').value.trim();
            S.set(S.coll.requests, current.id, { status: status, adminNotes: notes, updatedAt: new Date().toISOString() })
                .then(function () { U.closeModal('modal'); U.toast('Request update ho gayi.'); load(); })
                .catch(function (err) { console.error(err); U.toast('Could not update.'); });
        }

        function exportCsv() {
            var data = [['Request ID', 'Date', 'Customer', 'Mobile', 'Service', 'Message', 'Status', 'Admin Notes']];
            rows.forEach(function (r) {
                data.push([r.requestId, r.createdAt, r.customerName, r.mobile, r.serviceName, r.message, r.status, r.adminNotes || '']);
            });
            U.csv('service-requests.csv', data);
        }
    })();
    </script>
</body>
</html>
