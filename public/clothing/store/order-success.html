<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed · Apna Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner"><span>Order Confirmed</span><span class="sp"></span><a href="index.html">Continue Shopping</a></div></div>
<header class="header"><div class="header-inner"><a href="index.html" class="brand"><span class="logo">A</span> Apna Clothing</a></div></header>
<div class="wrap" style="padding:60px 20px;text-align:center;max-width:600px">
  <div style="width:80px;height:80px;border-radius:50%;background:#e8f7ee;color:#16a34a;display:grid;place-items:center;font-size:36px;margin:0 auto 16px"><i class="fas fa-check"></i></div>
  <h1 style="font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px">Order Placed Successfully! 🎉</h1>
  <p class="small muted" style="margin-bottom:18px">Thank you for shopping with Apna Clothing. Your order has been confirmed.</p>
  <div id="info" style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:left;margin-bottom:18px"></div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <a href="orders.html" class="btn btn-primary"><i class="fas fa-receipt"></i> View My Orders</a>
    <a href="index.html" class="btn btn-ghost"><i class="fas fa-bag-shopping"></i> Continue Shopping</a>
  </div>
</div>
<script src="assets/store.js"></script>
<script>
function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
document.addEventListener('DOMContentLoaded', function () {
  StoreAPI.renderShell();
  var id = new URLSearchParams(location.search).get('id');
  var orders = StoreAPI.getMyOrders();
  var o = orders.filter(function (x) { return x.orderId === id; })[0];
  if (!o) { document.getElementById('info').innerHTML = '<p class="small muted">Order not found.</p>'; return; }
  var html = '<div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="color:var(--mid);font-size:13px">Order ID</span><b style="font-size:13px">' + o.orderId + '</b></div>';
  html += '<div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="color:var(--mid);font-size:13px">Date</span><b style="font-size:13px">' + new Date(o.createdAt).toLocaleString('en-IN') + '</b></div>';
  html += '<div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="color:var(--mid);font-size:13px">Payment</span><b style="font-size:13px">' + o.paymentMode + '</b></div>';
  html += '<div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="color:var(--mid);font-size:13px">Status</span><b style="font-size:13px;color:var(--green)">' + o.status + '</b></div>';
  html += '<div class="row" style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--mid);font-size:13px">Total</span><b style="font-size:15px">' + money(o.total) + '</b></div>';
  html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9"><b style="font-size:12px;color:var(--mid)">Items:</b>';
  o.items.forEach(function (i) { html += '<div style="font-size:12.5px;padding:3px 0">' + i.name + ' × ' + i.qty + ' — ' + money(i.price * i.qty) + '</div>'; });
  html += '</div>';
  document.getElementById('info').innerHTML = html;
});
</script>
</body>
</html>
