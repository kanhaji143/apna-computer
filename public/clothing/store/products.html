<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products · Apnivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner"><span>Free shipping above ₹999</span><span class="sp"></span><a href="orders.html">My Orders</a><a href="../panel/login.html">Seller Login</a></div></div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="logo">A</span> Apnivo</a>
    <form class="search" onsubmit="doSearch(event)"><i class="fas fa-magnifying-glass" style="color:var(--light)"></i><input id="q" placeholder="Search products..."><button type="submit">Search</button></form>
    <nav class="nav"><a href="products.html">Shop</a><a href="wishlist.html" style="position:relative"><i class="fas fa-heart" style="font-size:18px;color:var(--red,#dc2626)"></i><span class="wish-badge" style="display:none">0</span></a><a href="cart.html" class="cart"><i class="fas fa-bag-shopping" style="font-size:18px"></i><span class="cart-badge" style="display:none">0</span></a></nav>
  </div>
</header>

<div class="wrap" style="padding-top:24px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
    <h1 style="font-size:22px;font-weight:900;letter-spacing:-.4px;flex:1">All Products</h1>
    <select id="catFilter" onchange="applyFilters()" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px"><option value="">All Categories</option></select>
    <select id="sort" onchange="applyFilters()" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px">
      <option value="default">Sort: Default</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="name">Name: A-Z</option>
    </select>
  </div>
  <div class="products" id="grid"></div>
  <p id="empty" class="small muted" style="text-align:center;padding:40px;display:none">No products found.</p>
</div>

<footer class="footer"><div class="wrap"><div class="bottom"><span>© 2026 Apnivo</span></div></div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/store.js"></script>
<script>
function doSearch(e) { e.preventDefault(); var q = document.getElementById('q').value.trim(); location.href = 'products.html?q=' + encodeURIComponent(q); }
function iconFor(cat) { var m = { Jeans:'fa-jeans', Shirt:'fa-shirt', Saree:'fa-person-dress', Kurti:'fa-vest', Jacket:'fa-vest-patches' }; return m[cat] || 'fa-tag'; }
function productCard(p) {
  return '<div class="product"><div class="img">' + (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="">' : '<i class="fas ' + iconFor(p.category) + '"></i>') + (p.stock <= 5 ? '<span class="badge">Low stock</span>' : '') + '</div>' +
    '<div class="body"><div class="cat">' + (p.category || '') + '</div><div class="name">' + p.name + '</div>' +
    '<div class="rating"><i class="fas fa-star"></i> ' + p.rating + ' <span style="color:var(--light)">(' + p.reviews + ')</span></div>' +
    '<div class="price"><span class="sale">' + StoreAPI.money(p.sale) + '</span></div></div>' +
    '<div class="actions"><a href="product.html?id=' + p.id + '" class="btn btn-ghost btn-sm">View</a><button class="btn btn-primary btn-sm" onclick="StoreAPI.addToCart(\'' + p.id + '\',\'' + (p.size||'M') + '\',\'' + (p.color||'') + '\',1);this.textContent=\'Added ✓\'">Add</button></div></div>';
}
function applyFilters() {
  var cat = document.getElementById('catFilter').value;
  var sort = document.getElementById('sort').value;
  var q = new URLSearchParams(location.search).get('q') || '';
  var list = STORE.products.slice();
  if (cat) list = list.filter(function (p) { return p.category === cat; });
  if (q) { var ql = q.toLowerCase(); list = list.filter(function (p) { return (p.name + ' ' + p.category + ' ' + (p.description||'')).toLowerCase().indexOf(ql) > -1; }); }
  if (sort === 'price-asc') list.sort(function (a, b) { return (a.sale||0) - (b.sale||0); });
  else if (sort === 'price-desc') list.sort(function (a, b) { return (b.sale||0) - (a.sale||0); });
  else if (sort === 'name') list.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  document.getElementById('grid').innerHTML = list.length ? list.map(productCard).join('') : '';
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  if (q) document.getElementById('q').value = q;
}
document.addEventListener('DOMContentLoaded', function () {
  StoreAPI.loadProducts().then(function () {
    StoreAPI.renderShell();
    // populate cat filter
    var sel = document.getElementById('catFilter');
    STORE.categories.forEach(function (c) { var o = document.createElement('option'); o.value = c.name; o.textContent = c.name + ' (' + c.count + ')'; sel.appendChild(o); });
    var catParam = new URLSearchParams(location.search).get('cat');
    if (catParam) sel.value = catParam;
    applyFilters();
  });
});
</script>
</body>
</html>
