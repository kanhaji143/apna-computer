<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout · Apnivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner"><span>Secure Checkout</span><span class="sp"></span><a href="cart.html">Back to Cart</a></div></div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="logo">A</span> Apnivo</a>
    <nav class="nav"><a href="wishlist.html" style="position:relative"><i class="fas fa-heart" style="font-size:18px;color:var(--red,#dc2626)"></i><span class="wish-badge" style="display:none">0</span></a><a href="cart.html" class="cart"><i class="fas fa-bag-shopping" style="font-size:18px"></i><span class="cart-badge" style="display:none">0</span></a></nav>
  </div>
</header>

<div class="wrap">
  <h1 style="font-size:24px;font-weight:900;letter-spacing:-.5px;margin:24px 0 16px">Checkout</h1>
  <div class="checkout">
    <div>
      <div class="card">
        <h3><i class="fas fa-user"></i> Delivery Details</h3>
        <div class="field"><label>Full Name *</label><input id="cName" placeholder="Your name"></div>
        <div class="field"><label>Mobile Number *</label><input id="cMobile" type="tel" placeholder="10-digit mobile"></div>
        <div class="field"><label>Email (optional)</label><input id="cEmail" type="email" placeholder="email@example.com"></div>
        <div class="field"><label>Address *</label><textarea id="cAddr" rows="3" placeholder="House no, street, locality"></textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="field"><label>City *</label><input id="cCity" placeholder="City"></div>
          <div class="field"><label>PIN Code *</label><input id="cPin" placeholder="6-digit PIN"></div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3><i class="fas fa-wallet"></i> Payment Method</h3>
        <div class="payopt">
          <label><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label>
          <label><input type="radio" name="pay" value="UPI"> UPI / Online</label>
        </div>
        <p class="small muted" style="margin-top:10px">UPI payment: pay after order confirmation via WhatsApp.</p>
      </div>
    </div>
    <div class="summary">
      <h3>Order Summary</h3>
      <div id="items"></div>
      <div class="row total"><span>Total</span><span id="total">₹0</span></div>
      <button class="btn btn-primary" onclick="placeOrder()"><i class="fas fa-check"></i> Place Order</button>
      <p class="small muted" style="margin-top:10px;text-align:center">By placing order you agree to terms.</p>
    </div>
  </div>
</div>

<footer class="footer"><div class="wrap"><div class="bottom"><span>© 2026 Apnivo</span></div></div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/store.js"></script>
<script>
function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function renderSummary() {
  var cart = StoreAPI.getCart();
  var html = '';
  cart.forEach(function (i) {
    var p = StoreAPI.findProduct(i.productId);
    if (!p) return;
    html += '<div class="row"><span>' + p.name + ' × ' + i.qty + '</span><span>' + money(p.sale * i.qty) + '</span></div>';
  });
  var total = StoreAPI.cartTotal();
  var shipping = total >= 999 ? 0 : 99;
  html += '<div class="row"><span>Shipping</span><span>' + (shipping ? money(shipping) : 'FREE') + '</span></div>';
  document.getElementById('items').innerHTML = html;
  document.getElementById('total').textContent = money(total + shipping);
}
function placeOrder() {
  var name = document.getElementById('cName').value.trim();
  var mobile = document.getElementById('cMobile').value.trim();
  var addr = document.getElementById('cAddr').value.trim();
  var city = document.getElementById('cCity').value.trim();
  var pin = document.getElementById('cPin').value.trim();
  var email = document.getElementById('cEmail').value.trim();
  if (!name || !mobile || !addr || !city || !pin) { alert('Please fill all required fields.'); return; }
  if (mobile.length < 10) { alert('Enter valid 10-digit mobile.'); return; }
  var cart = StoreAPI.getCart();
  if (!cart.length) { alert('Cart is empty.'); return; }
  var total = StoreAPI.cartTotal();
  var shipping = total >= 999 ? 0 : 99;
  var grand = total + shipping;
  var pay = document.querySelector('input[name="pay"]:checked').value;
  var customer = { name: name, mobile: mobile, email: email, address: addr + ', ' + city + ' - ' + pin };
  var order = StoreAPI.placeOrder(customer, cart, grand, pay);
  location.href = 'order-success.html?id=' + order.orderId;
}
document.addEventListener('DOMContentLoaded', function () {
  StoreAPI.loadProducts().then(function () {
    StoreAPI.renderShell();
    if (!StoreAPI.getCart().length) { location.href = 'cart.html'; return; }
    renderSummary();
  });
});
</script>
</body>
</html>
