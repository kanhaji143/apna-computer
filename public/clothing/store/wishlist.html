<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist · Apna Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner"><span>My Wishlist</span><span class="sp"></span><a href="index.html">Continue Shopping</a></div></div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="logo">A</span> Apna Clothing</a>
    <nav class="nav"><a href="products.html">Shop</a><a href="wishlist.html" class="cart"><i class="fas fa-heart" style="font-size:18px;color:var(--red)"></i><span class="wish-badge" style="display:none">0</span></a><a href="wishlist.html" style="position:relative"><i class="fas fa-heart" style="font-size:18px;color:var(--red,#dc2626)"></i><span class="wish-badge" style="display:none">0</span></a><a href="cart.html" class="cart"><i class="fas fa-bag-shopping" style="font-size:18px"></i><span class="cart-badge" style="display:none">0</span></a></nav>
  </div>
</header>
<div class="wrap">
  <h1 style="font-size:24px;font-weight:900;letter-spacing:-.5px;margin:24px 0 16px">My Wishlist</h1>
  <div class="products" id="grid"></div>
  <p id="empty" class="small muted" style="text-align:center;padding:40px;display:none">Your wishlist is empty.</p>
</div>
<footer class="footer"><div class="wrap"><div class="bottom"><span>© 2026 Apna Clothing</span></div></div></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/store.js"></script>
<script>
function iconFor(cat) { var m = { Jeans:'fa-jeans', Shirt:'fa-shirt', Saree:'fa-person-dress', Kurti:'fa-vest', Jacket:'fa-vest-patches' }; return m[cat] || 'fa-tag'; }
function productCard(p) {
  return '<div class="product"><div class="img">' + (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="">' : '<i class="fas ' + iconFor(p.category) + '"></i>') + '</div>' +
    '<div class="body"><div class="cat">' + (p.category || '') + '</div><div class="name">' + p.name + '</div>' +
    '<div class="price"><span class="sale">' + StoreAPI.money(p.sale) + '</span></div></div>' +
    '<div class="actions"><a href="product.html?id=' + p.id + '" class="btn btn-ghost btn-sm">View</a><button class="btn btn-primary btn-sm" onclick="StoreAPI.addToCart(\'' + p.id + '\',\'' + (p.size||'M') + '\',\'\',1);this.textContent=\'Added ✓\'">Add to Cart</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="StoreAPI.toggleWish(\'' + p.id + '\');render()"><i class="fas fa-trash" style="color:var(--red)"></i></button></div></div>';
}
function render() {
  var wished = StoreAPI.getWishlist();
  var prods = STORE.products.filter(function (p) { return wished.indexOf(p.id) > -1; });
  document.getElementById('grid').innerHTML = prods.length ? prods.map(productCard).join('') : '';
  document.getElementById('empty').style.display = prods.length ? 'none' : 'block';
}
document.addEventListener('DOMContentLoaded', function () {
  StoreAPI.loadProducts().then(function () { StoreAPI.renderShell(); render(); });
});
</script>
</body>
</html>
