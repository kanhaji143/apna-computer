<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product · Apna Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/store.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner"><span>Free shipping above ₹999</span><span class="sp"></span><a href="orders.html">My Orders</a><a href="../panel/login.html">Seller Login</a></div></div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="logo">A</span> Apna Clothing</a>
    <form class="search" onsubmit="doSearch(event)"><i class="fas fa-magnifying-glass" style="color:var(--light)"></i><input id="q" placeholder="Search..."><button type="submit">Search</button></form>
    <nav class="nav"><a href="products.html">Shop</a><a href="wishlist.html" style="position:relative"><i class="fas fa-heart" style="font-size:18px;color:var(--red,#dc2626)"></i><span class="wish-badge" style="display:none">0</span></a><a href="cart.html" class="cart"><i class="fas fa-bag-shopping" style="font-size:18px"></i><span class="cart-badge" style="display:none">0</span></a></nav>
  </div>
</header>

<div class="wrap">
  <div id="detail" class="detail"><p class="small muted">Loading...</p></div>
  <div id="reviewsSection" style="padding:0 0 40px">
    <h2 style="font-size:20px;font-weight:800;letter-spacing:-.4px;margin:24px 0 12px">Reviews</h2>
    <div id="reviewsList" class="small muted">Loading reviews...</div>
    <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px">
      <h3 style="font-size:14px;font-weight:700;margin-bottom:10px">Write a review</h3>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <select id="revRating" style="padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px">
          <option value="5">★★★★★ 5</option><option value="4">★★★★ 4</option><option value="3">★★★ 3</option><option value="2">★★ 2</option><option value="1">★ 1</option>
        </select>
        <input id="revName" placeholder="Your name" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px">
      </div>
      <textarea id="revText" rows="3" placeholder="Share your experience..." style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit"></textarea>
      <button class="btn btn-primary" style="margin-top:10px" onclick="submitReview()">Submit Review</button>
    </div>
  </div>
</div>

<footer class="footer"><div class="wrap"><div class="bottom"><span>© 2026 Apna Clothing</span></div></div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/store.js"></script>
<script>
function doSearch(e) { e.preventDefault(); var q = document.getElementById('q').value.trim(); location.href = 'products.html?q=' + encodeURIComponent(q); }
function iconFor(cat) { var m = { Jeans:'fa-jeans', Shirt:'fa-shirt', Saree:'fa-person-dress', Kurti:'fa-vest', Jacket:'fa-vest-patches' }; return m[cat] || 'fa-tag'; }
var qty = 1, size = 'M', currentId = null;
function renderDetail() {
  var id = new URLSearchParams(location.search).get('id');
  currentId = id;
  var p = StoreAPI.findProduct(id);
  if (!p) { document.getElementById('detail').innerHTML = '<p class="small muted">Product not found.</p>'; return; }
  size = p.size || 'M';
  var sizes = (p.size || 'M').split(',').map(function (s) { return s.trim(); });
  if (sizes.length === 1 && sizes[0] === '') sizes = ['M','L','XL','XXL'];
  document.getElementById('detail').innerHTML =
    '<div class="img">' + (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="">' : '<i class="fas ' + iconFor(p.category) + '"></i>') + '</div>' +
    '<div class="info">' +
      '<div class="cat">' + (p.category || '') + '</div>' +
      '<h1>' + p.name + '</h1>' +
      '<div class="rating"><i class="fas fa-star"></i> ' + p.rating + ' <span style="color:var(--light)">(' + p.reviews + ' reviews)</span></div>' +
      '<div class="price">' + StoreAPI.money(p.sale) + (p.purchase && p.purchase < p.sale ? '<span class="old">' + StoreAPI.money(Math.round(p.purchase * 1.3)) + '</span>' : '') + '</div>' +
      '<div class="desc">' + (p.description || '') + (p.color ? ' Color: ' + p.color + '.' : '') + '</div>' +
      '<div style="font-size:12px;color:var(--mid);margin-bottom:12px">Size: <b>' + (p.size || 'M') + '</b> · Stock: <b>' + (p.stock || 0) + '</b></div>' +
      '<div class="sizes" id="sizes"></div>' +
      '<div class="qty"><button onclick="changeQty(-1)">-</button><span id="qtyVal">1</span><button onclick="changeQty(1)">+</button></div>' +
      '<div class="cta">' +
        '<button class="btn btn-primary" onclick="addCart(\'' + p.id + '\')"><i class="fas fa-bag-shopping"></i> Add to Cart</button>' +
        '<button class="btn btn-ghost" id="wishBtn" onclick="toggleWish(\'' + p.id + '\')"><i class="fas fa-heart"></i></button>' +
        '<a href="cart.html" class="btn btn-orange"><i class="fas fa-bolt"></i> Buy Now</a>' +
      '</div>' +
    '</div>';
  document.getElementById('sizes').innerHTML = sizes.map(function (s, i) {
    return '<span class="size' + (i === 0 ? ' active' : '') + '" onclick="pickSize(this,\'' + s + '\')">' + s + '</span>';
  }).join('');
  size = sizes[0];
  updateWishBtn();
  loadReviews(p.id);
}
function toggleWish(id) {
  StoreAPI.toggleWish(id);
  updateWishBtn();
  StoreAPI.renderShell();
}
function updateWishBtn() {
  var btn = document.getElementById('wishBtn');
  if (!btn || !currentId) return;
  if (StoreAPI.isWished(currentId)) { btn.style.color = 'var(--red,#dc2626)'; btn.style.borderColor = 'var(--red,#dc2626)'; }
  else { btn.style.color = ''; btn.style.borderColor = ''; }
}
function loadReviews(pid) {
  StoreAPI.getReviews(pid).then(function (rows) {
    var el = document.getElementById('reviewsList');
    if (!rows.length) { el.innerHTML = '<p class="small muted">No reviews yet. Be the first!</p>'; return; }
    el.innerHTML = rows.map(function (r) {
      var stars = '';
      for (var i = 0; i < 5; i++) stars += (i < r.rating ? '★' : '☆');
      return '<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
        '<b style="font-size:13px">' + (r.name || 'Anonymous') + '</b>' +
        '<span style="color:#d97706;font-size:13px">' + stars + '</span></div>' +
        '<p style="font-size:13px;color:var(--mid);margin:0">' + (r.text || '') + '</p>' +
        '<div style="font-size:10.5px;color:var(--light);margin-top:4px">' + new Date(r.createdAt).toLocaleDateString('en-IN') + '</div></div>';
    }).join('');
  });
}
function submitReview() {
  if (!currentId) return;
  var rating = document.getElementById('revRating').value;
  var name = document.getElementById('revName').value.trim() || 'Anonymous';
  var text = document.getElementById('revText').value.trim();
  if (!text) { alert('Please write a review.'); return; }
  StoreAPI.addReview(currentId, rating, text, name);
  document.getElementById('revText').value = '';
  document.getElementById('revName').value = '';
  loadReviews(currentId);
}
function pickSize(el, s) { document.querySelectorAll('.size').forEach(function (x) { x.classList.remove('active'); }); el.classList.add('active'); size = s; }
function changeQty(d) { qty = Math.max(1, qty + d); document.getElementById('qtyVal').textContent = qty; }
function addCart(id) { StoreAPI.addToCart(id, size, '', qty); var btn = event.target; btn.textContent = 'Added ✓'; setTimeout(function () { btn.innerHTML = '<i class="fas fa-bag-shopping"></i> Add to Cart'; }, 1200); }
document.addEventListener('DOMContentLoaded', function () {
  StoreAPI.loadProducts().then(function () { StoreAPI.renderShell(); renderDetail(); });
});
</script>
</body>
</html>
