<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses · Apnivo Business</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/clothing.css">
</head>
<body data-page="expenses">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Expenses</h2>
                    <p>Dukaan ke saare kharch</p>
                </div>
                <button class="btn btn-primary" onclick="App.addExpense()"><i class="fas fa-plus"></i> Add Expense</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-receipt"></i></div>
                    <div><div class="stat-value" id="exTotal">₹0</div><div class="stat-label">Other Expenses</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-users"></i></div>
                    <div><div class="stat-value" id="exSalary">₹0</div><div class="stat-label">Salaries Paid</div></div></div>
                <div class="stat-card"><div class="stat-icon red"><i class="fas fa-sack-dollar"></i></div>
                    <div><div class="stat-value" id="exAll">₹0</div><div class="stat-label">Total Expenses</div></div></div>
            </div>

            <div class="card">
                <div class="card-head"><h3>Expense Register</h3></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Category</th><th>Description</th><th>Paid To</th><th>Mode</th><th class="num">Amount</th><th></th></tr>
                        </thead>
                        <tbody id="expensesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/data.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
