<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Apnivo Business</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/clothing.css">
</head>
<body data-page="dashboard">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Dashboard</h2>
                    <p>Business ka poora overview</p>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn btn-light" onclick="App.whatsappLowStock()" style="background:#25D366;color:#fff;border-color:#25D366">
                        <i class="fab fa-whatsapp"></i> Low Stock Alert
                    </button>
                    <a class="btn btn-light" href="purchases.html"><i class="fas fa-cart-flatbed"></i> New Purchase</a>
                    <a class="btn btn-primary" href="sales.html"><i class="fas fa-cash-register"></i> New Sale</a>
                </div>
            </div>

            <div class="stats-grid" id="dashStats"></div>

            <div class="card">
                <div class="card-head">
                    <h3><i class="fas fa-triangle-exclamation" style="color:var(--warn)"></i> Low Stock Alert</h3>
                    <a href="products.html" class="btn btn-light btn-sm">All Products <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Product</th><th>Wholeseller</th><th>Stock</th><th class="num">Cost</th></tr></thead>
                        <tbody id="lowStock"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3><i class="fas fa-cash-register" style="color:var(--success)"></i> Recent Sales</h3>
                    <a href="sales.html" class="btn btn-light btn-sm">All Sales <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Bill</th><th>Customer</th><th class="num">Amount</th><th class="num">Profit</th></tr></thead>
                        <tbody id="recentSales"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/data.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
