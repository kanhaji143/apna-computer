<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products · Clothing CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/clothing.css">
</head>
<body data-page="products">

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <div class="page-head">
                <div>
                    <h2>Products</h2>
                    <p>Kaun sa product hai, kitna stock, purchase aur sale price</p>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn btn-light" onclick="App.scanFor('product')"><i class="fas fa-barcode"></i> Scan</button>
                    <button class="btn btn-primary" onclick="App.addProduct()"><i class="fas fa-plus"></i> Add Product</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-shirt"></i></div>
                    <div><div class="stat-value" id="pTotal">0</div><div class="stat-label">Total Products</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-warehouse"></i></div>
                    <div><div class="stat-value" id="pStockVal">₹0</div><div class="stat-label">Stock Value (cost)</div></div></div>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3>Product List</h3>
                    <input type="text" class="form-control" style="width:230px" placeholder="Search product..." oninput="App.search(this.value)">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th><th>Size / Color</th><th>Wholeseller</th>
                                <th class="num">Purchase</th><th class="num">Sale</th><th class="num">Margin</th>
                                <th>Stock</th><th class="num">Stock Value</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/data.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
